name: Security Scan with OWASP ZAP

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    # Step 1: Build dan jalankan Flask app
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      
    - name: Start Flask SocketIO application
      run: |
        export FLASK_DEBUG=False
        export FLASK_HOST=0.0.0.0
        export FLASK_PORT=5000
        export SECRET_KEY=test-secret-key-for-ci
        export ALLOWED_ORIGINS=http://localhost:5000
        python app.py &
        # Tunggu sampai Flask SocketIO ready
        sleep 30
        
    - name: Wait for Flask application to be ready
      run: |
        timeout 300 bash -c 'until curl -f http://localhost:5000/health || curl -f http://localhost:5000; do sleep 5; done'
        
    # Step 3: ZAP Baseline Scan
    - name: ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.12.0
      with:
        target: 'http://localhost:5000'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'
        
    # Step 4: Upload results
    - name: Upload ZAP results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: zap-results
        path: report_html.html

